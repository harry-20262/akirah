<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marginalia</title>
<style>
  * { box-sizing: border-box; }

  :root {
    --paper: #EFF1EC;
    --paper-raised: #FBFAF6;
    --ink: #1D2A26;
    --ink-soft: #5B6B63;
    --ink-faint: #8B978F;
    --pine: #3D6B63;
    --pine-dark: #2C4E48;
    --gold: #A9821F;
    --card: #E4E9E0;
    --line: #D6D9D2;
    --danger: #A63D3D;
  }

  :root[data-theme="dark"] {
    --paper: #181F1C;
    --paper-raised: #202924;
    --ink: #E7ECE8;
    --ink-soft: #A7B3AC;
    --ink-faint: #6E7A73;
    --pine: #5FA396;
    --pine-dark: #3D6B63;
    --gold: #D6B45C;
    --card: #222C27;
    --line: #333F38;
    --danger: #D98787;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    max-width: 640px;
    margin: 0 auto;
    padding: 32px 28px 48px 40px;
    background: var(--paper);
    color: var(--ink);
    border-left: 6px solid var(--pine-dark);
    min-height: 100vh;
    transition: background 0.2s ease, color 0.2s ease;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-size: 28px;
    font-weight: 600;
    font-style: italic;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  #title-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }

  p.sub {
    color: var(--ink-soft);
    font-size: 13px;
    margin-top: 0;
    margin-bottom: 24px;
    max-width: 42ch;
  }

  input, textarea, button {
    font-family: inherit;
    font-size: 14px;
  }

  #compose {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 20px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--line);
  }

  #compose-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  #compose-actions #send-btn {
    margin-left: auto;
  }

  textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    resize: none;
    background: var(--paper-raised);
    color: var(--ink);
    min-height: 56px;
    line-height: 1.5;
  }
  textarea:focus, .pin-box:focus, #name-input:focus { outline: none; border-color: var(--pine); }

  button {
    padding: 9px 16px;
    border: 1px solid var(--pine-dark);
    border-radius: 6px;
    background: var(--pine);
    color: var(--paper-raised);
    font-weight: 500;
    cursor: pointer;
  }
  button:hover { background: var(--pine-dark); }
  button:disabled { background: var(--line); border-color: var(--line); color: var(--ink-faint); cursor: default; }

  .icon-btn {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    color: var(--ink-soft);
    width: 40px;
    height: 40px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--card); }
  .icon-btn svg { width: 18px; height: 18px; }

  #theme-toggle {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    color: var(--ink-soft);
    width: 36px;
    height: 36px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 4px;
  }
  #theme-toggle:hover { background: var(--card); }
  #theme-toggle svg { width: 17px; height: 17px; }

  #title-actions {
    display: flex;
    gap: 8px;
  }

  #change-name-btn {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    color: var(--ink-soft);
    width: 36px;
    height: 36px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 4px;
  }
  #change-name-btn:hover { background: var(--card); }
  #change-name-btn svg { width: 16px; height: 16px; }

  #panic-btn {
    background: var(--paper-raised);
    border: 1px solid var(--danger);
    color: var(--danger);
    width: 36px;
    height: 36px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 4px;
  }
  #panic-btn:hover { background: var(--danger); color: var(--paper-raised); }
  #panic-btn svg { width: 16px; height: 16px; }

  #search-row {
    margin-bottom: 20px;
  }
  #search-input {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--paper-raised);
    color: var(--ink);
  }
  #search-input:focus { outline: none; border-color: var(--pine); }
  #search-count {
    font-size: 12px;
    color: var(--ink-faint);
    margin-top: 6px;
  }

  #image-preview-row {
    display: none;
    align-items: center;
    gap: 8px;
  }
  #image-preview-row img {
    max-height: 56px;
    border-radius: 6px;
    border: 1px solid var(--line);
  }
  #remove-image-btn {
    background: none;
    border: none;
    color: var(--ink-faint);
    font-size: 12px;
    padding: 4px 8px;
  }
  #remove-image-btn:hover { color: var(--ink-soft); background: none; }

  .msg-image {
    max-width: 100%;
    border-radius: 6px;
    margin-bottom: 8px;
    display: block;
    cursor: pointer;
  }

  #lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 20, 18, 0.92);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 24px;
    cursor: zoom-out;
  }
  #lightbox.open { display: flex; }
  #lightbox img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 8px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  }
  #lightbox-close {
    position: absolute;
    top: 18px;
    right: 22px;
    background: none;
    border: none;
    color: var(--paper-raised);
    font-size: 28px;
    line-height: 1;
    padding: 4px 10px;
    cursor: pointer;
  }
  #lightbox-close:hover { background: rgba(255,255,255,0.1); }

  #messages {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .msg {
    background: var(--card);
    border-left: 3px solid var(--pine);
    border-radius: 0 8px 8px 0;
    padding: 12px 16px;
  }

  .msg-meta {
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 5px;
  }

  .msg-time {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 12px;
    color: var(--gold);
  }

  .msg-sender {
    font-size: 11px;
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .msg-edited, .msg-seen {
    font-size: 11px;
    color: var(--ink-faint);
    font-style: italic;
  }

  .msg-text {
    font-size: 14.5px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .edit-textarea {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--pine);
    border-radius: 6px;
    background: var(--paper-raised);
    color: var(--ink);
    min-height: 50px;
    margin-bottom: 6px;
  }

  .msg-actions {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 8px;
    flex-wrap: wrap;
  }

  .heart-btn {
    background: none;
    border: none;
    padding: 0;
    color: var(--ink-faint);
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
  }
  .heart-btn:hover { background: none; color: var(--danger); }
  .heart-btn.active { color: var(--danger); }
  .heart-btn svg { width: 15px; height: 15px; }

  .text-action {
    background: none;
    border: none;
    font-size: 12px;
    padding: 0;
    cursor: pointer;
  }
  .text-action:hover { background: none; }
  .reply-toggle, .delete-action { color: var(--danger); }
  .reply-toggle:hover, .delete-action:hover { color: #8a2f2f; }
  .edit-action { color: var(--ink-soft); }
  .edit-action:hover { color: var(--ink); }

  .replies {
    margin-top: 10px;
    padding-left: 14px;
    border-left: 2px solid var(--line);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .reply-text {
    font-size: 13.5px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .reply-compose {
    display: flex;
    gap: 6px;
    margin-top: 10px;
  }
  .reply-compose textarea {
    min-height: 34px;
    font-size: 13px;
  }
  .reply-compose button {
    padding: 7px 14px;
    font-size: 13px;
  }

  .edit-row {
    display: flex;
    gap: 6px;
  }
  .edit-row button { padding: 6px 12px; font-size: 12px; }
  .edit-cancel { background: var(--paper-raised); border-color: var(--line); color: var(--ink-soft); }
  .edit-cancel:hover { background: var(--card); }

  #empty {
    text-align: center;
    color: var(--ink-faint);
    padding: 48px 0;
    font-size: 14px;
    font-family: 'Fraunces', serif;
    font-style: italic;
  }

  #status {
    font-size: 12px;
    color: var(--ink-faint);
    text-align: center;
    margin-top: 16px;
  }

  #lock-screen, #name-screen {
    max-width: 280px;
    margin: 100px auto 0;
    text-align: center;
  }
  #lock-screen h1, #name-screen h1 {
    font-size: 22px;
    margin-bottom: 4px;
  }
  #lock-screen p.sub, #name-screen p.sub {
    margin: 0 auto 32px;
    text-align: center;
  }
  #pin-boxes {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin-bottom: 18px;
  }
  .pin-cell {
    position: relative;
    width: 34px;
    height: 44px;
  }
  .pin-box {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    text-align: center;
    font-size: 22px;
    font-family: 'Fraunces', serif;
    border: none;
    border-bottom: 2px solid var(--ink-faint);
    background: transparent;
    color: transparent;
    -webkit-text-fill-color: transparent;
    caret-color: transparent;
  }
  .pin-dot {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    font-family: 'Fraunces', serif;
    color: var(--ink);
    pointer-events: none;
  }
  #pin-error {
    color: var(--danger);
    font-size: 13px;
    min-height: 18px;
    margin-bottom: 8px;
  }
  #name-input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--paper-raised);
    color: var(--ink);
    text-align: center;
    margin-bottom: 14px;
  }
  #app-content, #name-screen { display: none; }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body>

<div id="lock-screen">
  <h1>Marginalia</h1>
  <div id="pin-boxes">
    <div class="pin-cell"><input type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="pin-box" data-idx="0"><span class="pin-dot"></span></div>
    <div class="pin-cell"><input type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="pin-box" data-idx="1"><span class="pin-dot"></span></div>
    <div class="pin-cell"><input type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="pin-box" data-idx="2"><span class="pin-dot"></span></div>
    <div class="pin-cell"><input type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="pin-box" data-idx="3"><span class="pin-dot"></span></div>
  </div>
  <div id="pin-error"></div>
</div>

<div id="name-screen">
  <h1>One more thing</h1>
  <p class="sub">What should we call you on this device? Only used to tell your messages apart.</p>
  <input type="text" id="name-input" placeholder="Your name" maxlength="24">
  <button id="name-save-btn" style="width:100%;">Continue</button>
  <button id="name-cancel-btn" style="width:100%; margin-top:8px; background:var(--paper-raised); border-color:var(--line); color:var(--ink-soft); display:none;">Cancel</button>
</div>

<div id="app-content">
<div id="title-row">
  <div>
    <h1>Marginalia</h1>
    <p class="sub">A page for the two of you. Write something, or reply to what's already here.</p>
  </div>
  <div id="title-actions">
    <button id="panic-btn" title="Close instantly (Esc)" aria-label="Close instantly">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
    </button>
    <button id="change-name-btn" title="Change your name" aria-label="Change your name">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"></circle><path d="M4.5 20c1.5-4 5-5.5 7.5-5.5s6 1.5 7.5 5.5"></path></svg>
    </button>
    <button id="theme-toggle" title="Toggle dark mode" aria-label="Toggle dark mode">
      <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></svg>
    </button>
  </div>
</div>

<div id="search-row">
  <input type="text" id="search-input" placeholder="Search messages...">
  <div id="search-count"></div>
</div>

<div id="compose">
  <textarea id="msg-input" placeholder="Write a message..." maxlength="1000"></textarea>
  <div id="compose-actions">
    <button id="image-btn" class="icon-btn" title="Choose from gallery" aria-label="Choose image">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="8.5" cy="9.5" r="1.5"></circle><path d="M21 15l-5-5-4 4-2-2-5 5"></path></svg>
    </button>
    <input type="file" id="image-input" accept="image/*" style="display:none;">
    <button id="camera-btn" class="icon-btn" title="Take a photo" aria-label="Take photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
    </button>
    <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none;">
    <button id="send-btn">Send</button>
  </div>
  <div id="image-preview-row">
    <img id="image-preview" alt="Selected image preview">
    <button id="remove-image-btn">Remove</button>
  </div>
</div>

<div id="messages"></div>
<div id="empty" style="display:none;">Nothing written yet. Be the first.</div>
<div id="status">Connecting...</div>
</div>

<div id="lightbox">
  <button id="lightbox-close" aria-label="Close">&times;</button>
  <img id="lightbox-img" alt="Full size image">
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCWbBaAGnUPFaZv-t1jE7VCMJP0IiCJYHI",
  authDomain: "shared-messages-1e3fc.firebaseapp.com",
  databaseURL: "https://shared-messages-1e3fc-default-rtdb.firebaseio.com",
  projectId: "shared-messages-1e3fc",
  storageBucket: "shared-messages-1e3fc.firebasestorage.app",
  messagingSenderId: "995131724643",
  appId: "1:995131724643:web:241ec0bd8796dbafa1f956"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const authReady = auth.setPersistence(firebase.auth.Auth.Persistence.NONE);
let currentMessagesRef = null;
let currentPresenceRef = null;
let currentRoomKey = null;

const LOCK_EMAIL = 'login@shared-messages.local'; // your original room — unchanged
const ROOM_PASSWORD = 'notesapp'; // fixed password used for any additional room accounts you create

function roomEmailForPin(pin) {
  return 'login-' + pin + '@shared-messages.local';
}

/* ---------- Theme ---------- */
const SUN_PATH = '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
const MOON_PATH = '<path d="M21 12.6A9 9 0 1 1 11.4 3a7 7 0 0 0 9.6 9.6z"/>';
const themeToggle = document.getElementById('theme-toggle');
const themeIcon = document.getElementById('theme-icon');

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  themeIcon.innerHTML = theme === 'dark' ? SUN_PATH : MOON_PATH;
}
function initTheme() {
  const saved = localStorage.getItem('marginalia_theme');
  const theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  applyTheme(theme);
}
themeToggle.addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  localStorage.setItem('marginalia_theme', next);
  applyTheme(next);
});
initTheme();

/* ---------- Identity (device-local name) ---------- */
const nameScreen = document.getElementById('name-screen');
const nameInput = document.getElementById('name-input');
const nameSaveBtn = document.getElementById('name-save-btn');
const nameCancelBtn = document.getElementById('name-cancel-btn');
const changeNameBtn = document.getElementById('change-name-btn');
const panicBtn = document.getElementById('panic-btn');

function panicLock() {
  // Wipe the screen instantly, before signOut even resolves
  localStorage.setItem(LOCKOUT_KEY, Date.now() + LOCKOUT_MS);
  appContent.style.display = 'none';
  nameScreen.style.display = 'none';
  nameCancelBtn.style.display = 'none';
  isRenaming = false;
  messagesEl.innerHTML = '';
  msgInput.value = '';
  pendingImage = null;
  imagePreviewRow.style.display = 'none';
  imagePreview.src = '';
  lockScreen.style.display = 'block';
  pinBoxes.forEach(b => { b.value = ''; b.nextElementSibling.textContent = ''; b.disabled = false; });
  pinBoxes[0].focus();
  auth.signOut();
}
panicBtn.addEventListener('click', panicLock);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && appContent.style.display !== 'none') panicLock();
});
let currentUserName = localStorage.getItem('marginalia_name') || null;
let isRenaming = false;

function keyify(str) {
  return str.replace(/[.#$\[\]\/]/g, '_');
}

nameSaveBtn.addEventListener('click', saveName);
nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') saveName(); });
function saveName() {
  const v = nameInput.value.trim();
  if (!v) return;
  currentUserName = v;
  localStorage.setItem('marginalia_name', v);
  nameScreen.style.display = 'none';
  nameCancelBtn.style.display = 'none';
  if (isRenaming) {
    isRenaming = false;
    appContent.style.display = 'block';
    markSeenNow();
    render(latestList);
  } else {
    showApp();
  }
}

changeNameBtn.addEventListener('click', () => {
  isRenaming = true;
  nameInput.value = currentUserName || '';
  nameCancelBtn.style.display = 'block';
  appContent.style.display = 'none';
  nameScreen.style.display = 'block';
  nameInput.focus();
  nameInput.select();
});

nameCancelBtn.addEventListener('click', () => {
  isRenaming = false;
  nameScreen.style.display = 'none';
  nameCancelBtn.style.display = 'none';
  appContent.style.display = 'block';
});

/* ---------- Lock screen / PIN ---------- */
const lockScreen = document.getElementById('lock-screen');
const appContent = document.getElementById('app-content');
const pinBoxes = Array.from(document.querySelectorAll('.pin-box'));
const pinError = document.getElementById('pin-error');

const LOCKOUT_MS = 5 * 60 * 1000;
const LOCKOUT_KEY = 'marginalia_lockout_until';

function getLockoutRemaining() {
  const until = parseInt(localStorage.getItem(LOCKOUT_KEY) || '0', 10);
  return Math.max(0, until - Date.now());
}

function rejectAsWrongPin() {
  pinError.textContent = 'Wrong PIN. Try again.';
  pinBoxes.forEach(b => { b.value = ''; b.disabled = false; b.nextElementSibling.textContent = ''; });
  pinBoxes[0].focus();
}

function tryPinLogin() {
  const pin = pinBoxes.map(b => b.value).join('');
  if (pin.length !== 4) return;
  if (getLockoutRemaining() > 0) { rejectAsWrongPin(); return; }
  pinError.textContent = '';
  pinBoxes.forEach(b => b.disabled = true);
  authReady
    .then(() => auth.signInWithEmailAndPassword(roomEmailForPin(pin), ROOM_PASSWORD))
    .catch(() => auth.signInWithEmailAndPassword(LOCK_EMAIL, 'pin' + pin))
    .catch(rejectAsWrongPin);
}

pinBoxes.forEach((box, i) => {
  const dot = box.nextElementSibling;
  box.addEventListener('input', () => {
    box.value = box.value.replace(/[^0-9]/g, '').slice(0, 1);
    dot.textContent = box.value ? '•' : '';
    if (box.value && i < pinBoxes.length - 1) {
      pinBoxes[i + 1].focus();
    }
    if (pinBoxes.every(b => b.value.length === 1)) {
      tryPinLogin();
    }
  });
  box.addEventListener('keydown', (e) => {
    if (e.key === 'Backspace' && !box.value && i > 0) {
      pinBoxes[i - 1].focus();
    }
  });
});

auth.onAuthStateChanged((user) => {
  if (user) {
    currentRoomKey = user.email;
    const base = (user.email === LOCK_EMAIL) ? '' : ('rooms/' + user.uid + '/');
    currentMessagesRef = db.ref(base + 'messages');
    currentPresenceRef = db.ref(base + 'presence');
    lockScreen.style.display = 'none';
    if (!currentUserName) {
      nameScreen.style.display = 'block';
      nameInput.focus();
    } else {
      showApp();
    }
  } else {
    lockScreen.style.display = 'block';
    appContent.style.display = 'none';
    nameScreen.style.display = 'none';
    nameCancelBtn.style.display = 'none';
    isRenaming = false;
    pinBoxes.forEach(b => { b.value = ''; b.nextElementSibling.textContent = ''; b.disabled = false; });
    pinBoxes[0].focus();
    detachMessagesListener();
    currentMessagesRef = null;
    currentPresenceRef = null;
  }
});

let listenersAttached = false;
function showApp() {
  appContent.style.display = 'block';
  if (!listenersAttached) {
    attachMessagesListener();
    attachPresenceListener();
    listenersAttached = true;
  }
  markSeenNow();
  setTimeout(() => msgInput.focus(), 50);
}

/* ---------- Compose ---------- */
const msgInput = document.getElementById('msg-input');
const sendBtn = document.getElementById('send-btn');
const messagesEl = document.getElementById('messages');
const emptyEl = document.getElementById('empty');
const statusEl = document.getElementById('status');
const imageBtn = document.getElementById('image-btn');
const imageInput = document.getElementById('image-input');
const cameraBtn = document.getElementById('camera-btn');
const cameraInput = document.getElementById('camera-input');
const imagePreviewRow = document.getElementById('image-preview-row');
const imagePreview = document.getElementById('image-preview');
const removeImageBtn = document.getElementById('remove-image-btn');
const searchInput = document.getElementById('search-input');
const searchCount = document.getElementById('search-count');

let pendingImage = null;

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 900;
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          const scale = maxDim / Math.max(w, h);
          w = Math.round(w * scale);
          h = Math.round(h * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function handleFileSelected(file) {
  if (!file) return;
  try {
    pendingImage = await compressImage(file);
    imagePreview.src = pendingImage;
    imagePreviewRow.style.display = 'flex';
  } catch (e) {
    statusEl.textContent = 'Could not load that image.';
  }
}

imageBtn.addEventListener('click', () => imageInput.click());
imageInput.addEventListener('change', async () => {
  const file = imageInput.files[0];
  await handleFileSelected(file);
  imageInput.value = '';
});

cameraBtn.addEventListener('click', () => cameraInput.click());
cameraInput.addEventListener('change', async () => {
  const file = cameraInput.files[0];
  await handleFileSelected(file);
  cameraInput.value = '';
});

removeImageBtn.addEventListener('click', () => {
  pendingImage = null;
  imagePreviewRow.style.display = 'none';
  imagePreview.src = '';
});

function formatTime(ts) {
  const d = new Date(ts);
  return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}

/* ---------- Presence / seen ---------- */
let presenceData = {};
function markSeenNow() {
  if (!currentPresenceRef || !currentUserName) return;
  currentPresenceRef.child(keyify(currentUserName)).set(Date.now());
}
function attachPresenceListener() {
  currentPresenceRef.on('value', (snap) => {
    presenceData = snap.val() || {};
    render(latestList);
  });
}
setInterval(() => { if (document.visibilityState === 'visible') markSeenNow(); }, 20000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') markSeenNow(); });

function seenByOther(ts) {
  return Object.keys(presenceData).some(nameKey => {
    return nameKey !== keyify(currentUserName) && presenceData[nameKey] >= ts;
  });
}

/* ---------- Render ---------- */
let openReplyId = null;
let openEditId = null;
let latestList = [];
let searchQuery = '';

searchInput.addEventListener('input', () => {
  searchQuery = searchInput.value.trim().toLowerCase();
  render(latestList);
});

function toggleHeart(msgId, reactions) {
  const key = keyify(currentUserName);
  const ref = currentMessagesRef.child(msgId).child('reactions').child(key);
  if (reactions && reactions[key]) {
    ref.remove();
  } else {
    ref.set(true);
  }
}

function render(list) {
  messagesEl.innerHTML = '';
  let filtered = list;
  if (searchQuery) {
    filtered = list.filter(m => (m.text || '').toLowerCase().includes(searchQuery));
    searchCount.textContent = filtered.length + ' match' + (filtered.length === 1 ? '' : 'es');
  } else {
    searchCount.textContent = '';
  }

  if (!filtered || filtered.length === 0) {
    emptyEl.style.display = 'block';
    emptyEl.textContent = searchQuery ? 'No messages match your search.' : "Nothing written yet. Be the first.";
    return;
  }
  emptyEl.style.display = 'none';

  filtered.slice().reverse().forEach(m => {
    const div = document.createElement('div');
    div.className = 'msg';

    const meta = document.createElement('div');
    meta.className = 'msg-meta';
    const time = document.createElement('span');
    time.className = 'msg-time';
    time.textContent = formatTime(m.ts);
    meta.appendChild(time);
    if (m.sender) {
      const sender = document.createElement('span');
      sender.className = 'msg-sender';
      sender.textContent = m.sender;
      meta.appendChild(sender);
    }
    if (m.edited) {
      const edited = document.createElement('span');
      edited.className = 'msg-edited';
      edited.textContent = 'edited';
      meta.appendChild(edited);
    }
    if (m.sender === currentUserName && seenByOther(m.ts)) {
      const seen = document.createElement('span');
      seen.className = 'msg-seen';
      seen.textContent = 'Seen';
      meta.appendChild(seen);
    }
    div.appendChild(meta);

    if (m.image) {
      const img = document.createElement('img');
      img.className = 'msg-image';
      img.src = m.image;
      img.alt = 'Attached image';
      img.addEventListener('click', () => openLightbox(m.image));
      div.appendChild(img);
    }

    if (openEditId === m.id) {
      const editArea = document.createElement('textarea');
      editArea.className = 'edit-textarea';
      editArea.value = m.text;
      div.appendChild(editArea);
      const editRow = document.createElement('div');
      editRow.className = 'edit-row';
      const saveBtn = document.createElement('button');
      saveBtn.textContent = 'Save';
      saveBtn.addEventListener('click', () => saveEdit(m.id, editArea.value));
      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'edit-cancel';
      cancelBtn.textContent = 'Cancel';
      cancelBtn.addEventListener('click', () => { openEditId = null; render(latestList); });
      editRow.appendChild(saveBtn);
      editRow.appendChild(cancelBtn);
      div.appendChild(editRow);
    } else {
      const text = document.createElement('div');
      text.className = 'msg-text';
      text.textContent = m.text;
      div.appendChild(text);
    }

    const reactions = m.reactions || {};
    const heartCount = Object.keys(reactions).length;
    const iReacted = currentUserName && reactions[keyify(currentUserName)];

    const actions = document.createElement('div');
    actions.className = 'msg-actions';

    const heartBtn = document.createElement('button');
    heartBtn.className = 'heart-btn' + (iReacted ? ' active' : '');
    heartBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="' + (iReacted ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-7.5-4.6-10-9.1C.5 8.4 2.3 5 5.8 5c2 0 3.4 1.1 4.2 2.3C10.8 6.1 12.2 5 14.2 5c3.5 0 5.3 3.4 3.8 6.9C19.5 16.4 12 21 12 21z"/></svg>' + (heartCount > 0 ? '<span>' + heartCount + '</span>' : '');
    heartBtn.addEventListener('click', () => toggleHeart(m.id, reactions));
    actions.appendChild(heartBtn);

    const replyToggle = document.createElement('button');
    replyToggle.className = 'text-action reply-toggle';
    replyToggle.textContent = 'Reply';
    replyToggle.addEventListener('click', () => {
      openReplyId = openReplyId === m.id ? null : m.id;
      render(latestList);
    });
    actions.appendChild(replyToggle);

    if (m.sender === currentUserName) {
      const editBtn = document.createElement('button');
      editBtn.className = 'text-action edit-action';
      editBtn.textContent = 'Edit';
      editBtn.addEventListener('click', () => {
        openEditId = openEditId === m.id ? null : m.id;
        render(latestList);
      });
      actions.appendChild(editBtn);

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'text-action delete-action';
      deleteBtn.textContent = 'Delete';
      deleteBtn.addEventListener('click', () => {
        if (confirm('Delete this message?')) {
          currentMessagesRef.child(m.id).remove();
        }
      });
      actions.appendChild(deleteBtn);
    }

    div.appendChild(actions);

    if (m.replies) {
      const repliesArr = Object.values(m.replies).sort((a, b) => a.ts - b.ts);
      if (repliesArr.length > 0) {
        const repliesEl = document.createElement('div');
        repliesEl.className = 'replies';
        repliesArr.forEach(r => {
          const rDiv = document.createElement('div');
          const rTime = document.createElement('div');
          rTime.className = 'msg-time';
          rTime.textContent = formatTime(r.ts) + (r.sender ? ' · ' + r.sender : '');
          const rText = document.createElement('div');
          rText.className = 'reply-text';
          rText.textContent = r.text;
          rDiv.appendChild(rTime);
          rDiv.appendChild(rText);
          repliesEl.appendChild(rDiv);
        });
        div.appendChild(repliesEl);
      }
    }

    if (openReplyId === m.id) {
      const composeEl = document.createElement('div');
      composeEl.className = 'reply-compose';
      const rInput = document.createElement('textarea');
      rInput.placeholder = 'Write a reply...';
      rInput.maxLength = 1000;
      const rBtn = document.createElement('button');
      rBtn.textContent = 'Reply';
      rBtn.addEventListener('click', () => sendReply(m.id, rInput, rBtn));
      rInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendReply(m.id, rInput, rBtn);
        }
      });
      composeEl.appendChild(rInput);
      composeEl.appendChild(rBtn);
      div.appendChild(composeEl);
    }

    messagesEl.appendChild(div);
  });
}

function saveEdit(msgId, newText) {
  const text = newText.trim();
  if (!text) return;
  currentMessagesRef.child(msgId).update({ text, edited: true, editedTs: Date.now() });
  openEditId = null;
}

const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');
const lightboxClose = document.getElementById('lightbox-close');

function openLightbox(src) {
  lightboxImg.src = src;
  lightbox.classList.add('open');
}
function closeLightbox() {
  lightbox.classList.remove('open');
  lightboxImg.src = '';
}
lightbox.addEventListener('click', closeLightbox);
lightboxClose.addEventListener('click', (e) => { e.stopPropagation(); closeLightbox(); });
lightboxImg.addEventListener('click', (e) => e.stopPropagation());
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeLightbox();
});

function attachMessagesListener() {
  currentMessagesRef.on('value', (snapshot) => {
    const val = snapshot.val() || {};
    latestList = Object.keys(val)
      .map(id => ({ id, ...val[id] }))
      .sort((a, b) => a.ts - b.ts);
    statusEl.textContent = '';
    render(latestList);
  }, (err) => {
    statusEl.textContent = 'Could not connect. Check your database rules.';
  });
}

function detachMessagesListener() {
  if (currentMessagesRef) currentMessagesRef.off();
  if (currentPresenceRef) currentPresenceRef.off();
}

async function sendMessage() {
  const text = msgInput.value.trim();
  if (!text && !pendingImage) return;
  sendBtn.disabled = true;
  try {
    const newMsgRef = currentMessagesRef.push();
    await newMsgRef.set({
      text,
      image: pendingImage || null,
      ts: Date.now(),
      sender: currentUserName || null
    });
    msgInput.value = '';
    pendingImage = null;
    imagePreviewRow.style.display = 'none';
    imagePreview.src = '';
    markSeenNow();
  } catch (e) {
    statusEl.textContent = 'Could not send. Try again.';
  } finally {
    sendBtn.disabled = false;
    msgInput.focus();
  }
}

async function sendReply(msgId, inputEl, btnEl) {
  const text = inputEl.value.trim();
  if (!text) return;
  btnEl.disabled = true;
  try {
    const replyRef = currentMessagesRef.child(msgId).child('replies').push();
    await replyRef.set({ text, ts: Date.now(), sender: currentUserName || null });
    openReplyId = null;
    markSeenNow();
  } catch (e) {
    statusEl.textContent = 'Could not send reply. Try again.';
  } finally {
    btnEl.disabled = false;
  }
}

sendBtn.addEventListener('click', sendMessage);
msgInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
</script>
