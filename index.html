<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shared Notes</title>
<style>
  * { box-sizing: border-box; }

  :root {
    --paper: #EFF1EC;
    --paper-raised: #FBFAF6;
    --ink: #1D2A26;
    --ink-soft: #5B6B63;
    --ink-faint: #8B978F;
    --pine: #3D6B63;
    --pine-dark: #2C4E48;
    --gold: #A9821F;
    --card: #E4E9E0;
    --line: #D6D9D2;
    --danger: #A63D3D;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    max-width: 640px;
    margin: 0 auto;
    padding: 32px 28px 48px 40px;
    background: var(--paper);
    color: var(--ink);
    border-left: 6px solid var(--pine-dark);
    min-height: 100vh;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-size: 28px;
    font-weight: 600;
    font-style: italic;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  p.sub {
    color: var(--ink-soft);
    font-size: 13px;
    margin-top: 0;
    margin-bottom: 24px;
    max-width: 42ch;
  }

  input, textarea, button {
    font-family: inherit;
    font-size: 14px;
  }

  #compose {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 28px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--line);
  }

  #compose-row {
    display: flex;
    gap: 8px;
  }

  textarea {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    resize: none;
    background: var(--paper-raised);
    color: var(--ink);
    min-height: 42px;
    line-height: 1.5;
  }
  textarea:focus, .pin-box:focus {
    outline: none;
    border-color: var(--pine);
  }

  button {
    padding: 9px 16px;
    border: 1px solid var(--pine-dark);
    border-radius: 6px;
    background: var(--pine);
    color: var(--paper-raised);
    font-weight: 500;
    cursor: pointer;
  }
  button:hover { background: var(--pine-dark); }
  button:disabled { background: var(--line); border-color: var(--line); color: var(--ink-faint); cursor: default; }

  .attach-btn {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    color: var(--ink-soft);
    flex-shrink: 0;
  }
  .attach-btn:hover { background: var(--card); }

  #image-preview-row {
    display: none;
    align-items: center;
    gap: 8px;
  }
  #image-preview-row img {
    max-height: 56px;
    border-radius: 6px;
    border: 1px solid var(--line);
  }
  #remove-image-btn {
    background: none;
    border: none;
    color: var(--ink-faint);
    font-size: 12px;
    padding: 4px 8px;
  }
  #remove-image-btn:hover { color: var(--ink-soft); background: none; }

  .msg-image {
    max-width: 100%;
    border-radius: 6px;
    margin-bottom: 8px;
    display: block;
  }

  #messages {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .msg {
    background: var(--card);
    border-left: 3px solid var(--pine);
    border-radius: 0 8px 8px 0;
    padding: 12px 16px;
  }

  .msg-time {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 12px;
    color: var(--gold);
    margin-bottom: 5px;
  }

  .msg-text {
    font-size: 14.5px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .reply-toggle {
    background: none;
    border: none;
    color: var(--ink-faint);
    font-size: 12px;
    padding: 8px 0 0;
    cursor: pointer;
  }
  .reply-toggle:hover { color: var(--pine-dark); background: none; }

  .replies {
    margin-top: 10px;
    padding-left: 14px;
    border-left: 2px solid var(--line);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .reply-text {
    font-size: 13.5px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .reply-compose {
    display: flex;
    gap: 6px;
    margin-top: 10px;
  }
  .reply-compose textarea {
    min-height: 34px;
    font-size: 13px;
  }
  .reply-compose button {
    padding: 7px 14px;
    font-size: 13px;
  }

  #empty {
    text-align: center;
    color: var(--ink-faint);
    padding: 48px 0;
    font-size: 14px;
    font-family: 'Fraunces', serif;
    font-style: italic;
  }

  #status {
    font-size: 12px;
    color: var(--ink-faint);
    text-align: center;
    margin-top: 16px;
  }

  #lock-screen {
    max-width: 280px;
    margin: 100px auto 0;
    text-align: center;
  }
  #lock-screen h1 {
    font-size: 22px;
    margin-bottom: 4px;
  }
  #lock-screen p.sub {
    margin: 0 auto 32px;
    text-align: center;
  }
  #pin-boxes {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin-bottom: 18px;
  }
  .pin-box {
    width: 34px;
    height: 44px;
    text-align: center;
    font-size: 22px;
    font-family: 'Fraunces', serif;
    border: none;
    border-bottom: 2px solid var(--ink-faint);
    background: transparent;
    color: var(--ink);
  }
  #pin-error {
    color: var(--danger);
    font-size: 13px;
    min-height: 18px;
    margin-bottom: 8px;
  }
  #app-content { display: none; }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body>

<div id="lock-screen">
  <h1>Locked notebook</h1>
  <p class="sub">Enter the PIN to open it.</p>
  <div id="pin-boxes">
    <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="pin-box" data-idx="0">
    <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="pin-box" data-idx="1">
    <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="pin-box" data-idx="2">
    <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="pin-box" data-idx="3">
  </div>
  <div id="pin-error"></div>
</div>

<div id="app-content">
<h1>Shared notes</h1>
<p class="sub">A page for the two of you. Write something, or reply to what's already here.</p>

<div id="compose">
  <div id="compose-row">
    <textarea id="msg-input" placeholder="Write a message..." maxlength="1000"></textarea>
    <button id="image-btn" class="attach-btn" title="Choose from gallery" aria-label="Choose image">Image</button>
    <input type="file" id="image-input" accept="image/*" style="display:none;">
    <button id="camera-btn" class="attach-btn" title="Take a photo" aria-label="Take photo">Camera</button>
    <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none;">
    <button id="send-btn">Send</button>
  </div>
  <div id="image-preview-row">
    <img id="image-preview" alt="Selected image preview">
    <button id="remove-image-btn">Remove</button>
  </div>
</div>

<div id="messages"></div>
<div id="empty" style="display:none;">Nothing written yet. Be the first.</div>
<div id="status">Connecting...</div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCWbBaAGnUPFaZv-t1jE7VCMJP0IiCJYHI",
  authDomain: "shared-messages-1e3fc.firebaseapp.com",
  databaseURL: "https://shared-messages-1e3fc-default-rtdb.firebaseio.com",
  projectId: "shared-messages-1e3fc",
  storageBucket: "shared-messages-1e3fc.firebasestorage.app",
  messagingSenderId: "995131724643",
  appId: "1:995131724643:web:241ec0bd8796dbafa1f956"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const messagesRef = db.ref('messages');
const authReady = auth.setPersistence(firebase.auth.Auth.Persistence.NONE);

const LOCK_EMAIL = 'login@shared-messages.local';

const lockScreen = document.getElementById('lock-screen');
const appContent = document.getElementById('app-content');
const pinBoxes = Array.from(document.querySelectorAll('.pin-box'));
const pinError = document.getElementById('pin-error');

function tryPinLogin() {
  const pin = pinBoxes.map(b => b.value).join('');
  if (pin.length !== 4) return;
  pinError.textContent = '';
  pinBoxes.forEach(b => b.disabled = true);
  authReady
    .then(() => auth.signInWithEmailAndPassword(LOCK_EMAIL, 'pin' + pin))
    .catch(() => {
      pinError.textContent = 'Wrong PIN. Try again.';
      pinBoxes.forEach(b => { b.value = ''; b.disabled = false; });
      pinBoxes[0].focus();
    });
}

pinBoxes.forEach((box, i) => {
  box.addEventListener('input', () => {
    box.value = box.value.replace(/[^0-9]/g, '').slice(0, 1);
    if (box.value && i < pinBoxes.length - 1) {
      pinBoxes[i + 1].focus();
    }
    if (pinBoxes.every(b => b.value.length === 1)) {
      tryPinLogin();
    }
  });
  box.addEventListener('keydown', (e) => {
    if (e.key === 'Backspace' && !box.value && i > 0) {
      pinBoxes[i - 1].focus();
    }
  });
});

auth.onAuthStateChanged((user) => {
  if (user) {
    lockScreen.style.display = 'none';
    appContent.style.display = 'block';
    attachMessagesListener();
  } else {
    lockScreen.style.display = 'block';
    appContent.style.display = 'none';
    pinBoxes.forEach(b => { b.value = ''; b.disabled = false; });
    pinBoxes[0].focus();
    detachMessagesListener();
  }
});

const msgInput = document.getElementById('msg-input');
const sendBtn = document.getElementById('send-btn');
const messagesEl = document.getElementById('messages');
const emptyEl = document.getElementById('empty');
const statusEl = document.getElementById('status');
const imageBtn = document.getElementById('image-btn');
const imageInput = document.getElementById('image-input');
const cameraBtn = document.getElementById('camera-btn');
const cameraInput = document.getElementById('camera-input');
const imagePreviewRow = document.getElementById('image-preview-row');
const imagePreview = document.getElementById('image-preview');
const removeImageBtn = document.getElementById('remove-image-btn');

let pendingImage = null;

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 900;
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          const scale = maxDim / Math.max(w, h);
          w = Math.round(w * scale);
          h = Math.round(h * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function handleFileSelected(file) {
  if (!file) return;
  try {
    pendingImage = await compressImage(file);
    imagePreview.src = pendingImage;
    imagePreviewRow.style.display = 'flex';
  } catch (e) {
    statusEl.textContent = 'Could not load that image.';
  }
}

// Gallery picker
imageBtn.addEventListener('click', () => imageInput.click());
imageInput.addEventListener('change', async () => {
  const file = imageInput.files[0];
  await handleFileSelected(file);
  imageInput.value = '';
});

// Camera capture — capture="environment" opens the device camera directly on mobile;
// on desktop browsers without a camera-aware picker, it falls back to a normal file dialog.
cameraBtn.addEventListener('click', () => cameraInput.click());
cameraInput.addEventListener('change', async () => {
  const file = cameraInput.files[0];
  await handleFileSelected(file);
  cameraInput.value = '';
});

removeImageBtn.addEventListener('click', () => {
  pendingImage = null;
  imagePreviewRow.style.display = 'none';
  imagePreview.src = '';
});

function formatTime(ts) {
  const d = new Date(ts);
  return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}

function render(list) {
  messagesEl.innerHTML = '';
  if (!list || list.length === 0) {
    emptyEl.style.display = 'block';
    return;
  }
  emptyEl.style.display = 'none';
  list.slice().reverse().forEach(m => {
    const div = document.createElement('div');
    div.className = 'msg';

    const time = document.createElement('div');
    time.className = 'msg-time';
    time.textContent = formatTime(m.ts);

    const text = document.createElement('div');
    text.className = 'msg-text';
    text.textContent = m.text;

    div.appendChild(time);
    if (m.image) {
      const img = document.createElement('img');
      img.className = 'msg-image';
      img.src = m.image;
      img.alt = 'Attached image';
      div.appendChild(img);
    }
    div.appendChild(text);

    if (m.replies) {
      const repliesArr = Object.values(m.replies).sort((a, b) => a.ts - b.ts);
      if (repliesArr.length > 0) {
        const repliesEl = document.createElement('div');
        repliesEl.className = 'replies';
        repliesArr.forEach(r => {
          const rDiv = document.createElement('div');
          const rTime = document.createElement('div');
          rTime.className = 'msg-time';
          rTime.textContent = formatTime(r.ts);
          const rText = document.createElement('div');
          rText.className = 'reply-text';
          rText.textContent = r.text;
          rDiv.appendChild(rTime);
          rDiv.appendChild(rText);
          repliesEl.appendChild(rDiv);
        });
        div.appendChild(repliesEl);
      }
    }

    const toggle = document.createElement('button');
    toggle.className = 'reply-toggle';
    toggle.textContent = 'Reply';
    toggle.addEventListener('click', () => {
      openReplyId = openReplyId === m.id ? null : m.id;
      render(list);
    });
    div.appendChild(toggle);

    if (openReplyId === m.id) {
      const composeEl = document.createElement('div');
      composeEl.className = 'reply-compose';
      const rInput = document.createElement('textarea');
      rInput.placeholder = 'Write a reply...';
      rInput.maxLength = 1000;
      const rBtn = document.createElement('button');
      rBtn.textContent = 'Reply';
      rBtn.addEventListener('click', () => sendReply(m.id, rInput, rBtn));
      rInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendReply(m.id, rInput, rBtn);
        }
      });
      composeEl.appendChild(rInput);
      composeEl.appendChild(rBtn);
      div.appendChild(composeEl);
    }

    messagesEl.appendChild(div);
  });
}

let openReplyId = null;
let latestList = [];

function attachMessagesListener() {
  messagesRef.on('value', (snapshot) => {
    const val = snapshot.val() || {};
    latestList = Object.keys(val)
      .map(id => ({ id, ...val[id] }))
      .sort((a, b) => a.ts - b.ts);
    statusEl.textContent = '';
    render(latestList);
  }, (err) => {
    statusEl.textContent = 'Could not connect. Check your database rules.';
  });
}

function detachMessagesListener() {
  messagesRef.off();
}

async function sendMessage() {
  const text = msgInput.value.trim();
  if (!text && !pendingImage) return;
  sendBtn.disabled = true;
  try {
    const newMsgRef = messagesRef.push();
    await newMsgRef.set({
      text,
      image: pendingImage || null,
      ts: Date.now()
    });
    msgInput.value = '';
    pendingImage = null;
    imagePreviewRow.style.display = 'none';
    imagePreview.src = '';
  } catch (e) {
    statusEl.textContent = 'Could not send. Try again.';
  } finally {
    sendBtn.disabled = false;
  }
}

async function sendReply(msgId, inputEl, btnEl) {
  const text = inputEl.value.trim();
  if (!text) return;
  btnEl.disabled = true;
  try {
    const replyRef = db.ref('messages/' + msgId + '/replies').push();
    await replyRef.set({ text, ts: Date.now() });
    openReplyId = null;
  } catch (e) {
    statusEl.textContent = 'Could not send reply. Try again.';
  } finally {
    btnEl.disabled = false;
  }
}

sendBtn.addEventListener('click', sendMessage);
msgInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
</script>

</body>
</html>
